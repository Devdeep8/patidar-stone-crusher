# Production stack: Postgres + Redis + both backends + the queue worker.
# Frontends (admin-frontend, user-frontend) deploy on Vercel — they are NOT
# in this file. Run from the executor/ directory:
#
#   docker compose -f docker-compose.production.yml up -d --build
#
# Requires .env.production files in admin-backend/ and user-backend/ with
# strong JWT secrets, NODE_ENV=production, and ALLOWED_ORIGIN set to the
# Vercel domain(s). Do not run demo seeders in production.
#
# Run migrations from admin-backend only:
#   docker compose -f docker-compose.production.yml run --rm admin-backend \
#     npm run db:migrate
services:
  postgres:
    image: postgres:15-alpine
    container_name: psc-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patidar-stone-crusher-website-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env}
    # No ports published — backends reach it over the internal network only.
    # Host access for psql: docker exec -it psc-postgres psql -U postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: psc-redis
    restart: always
    # Password-protected, no published port — internal network only
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  user-backend:
    build:
      context: ../user-backend
      dockerfile: Dockerfile.production
    container_name: psc-user-backend
    restart: always
    env_file:
      - ../user-backend/.env.production
    environment:
      NODE_ENV: production
      DB_WRITE_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-patidar-stone-crusher-website-db}
      DB_USERNAME: ${APP_DB_USERNAME:-patidar_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in executor/.env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env}
      PORT: 3004
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=executor_app-network"
      - "traefik.http.routers.psc-user-api.rule=Host(`patidar-stone-cruhser-api.devdeep.dev`)"
      - "traefik.http.routers.psc-user-api.entrypoints=https"
      - "traefik.http.routers.psc-user-api.tls=true"
      - "traefik.http.routers.psc-user-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.psc-user-api.loadbalancer.server.port=3004"

  admin-backend:
    build:
      context: ../admin-backend
      dockerfile: Dockerfile.production
    container_name: psc-admin-backend
    restart: always
    env_file:
      - ../admin-backend/.env.production
    environment:
      NODE_ENV: production
      DB_WRITE_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-patidar-stone-crusher-website-db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env}
      PORT: 3006
    ports:
      - "127.0.0.1:3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=executor_app-network"
      - "traefik.http.routers.psc-admin-api.rule=Host(`admin-api-patidar-stone-cruhser.devdeep.dev`)"
      - "traefik.http.routers.psc-admin-api.entrypoints=https"
      - "traefik.http.routers.psc-admin-api.tls=true"
      - "traefik.http.routers.psc-admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.psc-admin-api.loadbalancer.server.port=3006"

  # Same admin-backend image; boots ALL queue consumers from the registry
  admin-backend-worker:
    build:
      context: ../admin-backend
      dockerfile: Dockerfile.production
    container_name: psc-admin-backend-worker
    restart: always
    env_file:
      - ../admin-backend/.env.production
    environment:
      NODE_ENV: production
      DB_WRITE_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-patidar-stone-crusher-website-db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env}
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
