services:
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: patidar-stone-crusher-postgres
    restart: always
    environment:
      POSTGRES_DB: patidar-stone-crusher-website-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patidar-stone-crusher-website-db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - app-network

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: patidar-stone-crusher-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app-network

  # =========================
  # User Backend
  # =========================
  user-backend:
    build:
      context: ../user-backend
      dockerfile: Dockerfile
    container_name: user-backend
    restart: always
    env_file:
      - ../user-backend/.env
    environment:
      DB_WRITE_HOST: postgres
      REDIS_HOST: redis
      CHOKIDAR_USEPOLLING: true
      PORT: 3004
    ports:
      - "3004:3004"
    volumes:
      - ../user-backend:/app
      - /app/node_modules
    command: npm run dev:nodemon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # =========================
  # User Frontend
  # =========================
  # frontend:
  #   build:
  #     context: ../user-frontend
  #     dockerfile: Dockerfile
  #   container_name: user-frontend
  #   restart: always
  #   ports:
  #     - "3005:3000"
  #   volumes:
  #     - ../user-frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   environment:
  #     NODE_ENV: development
  #     NEXT_PUBLIC_API_URL: http://localhost:3004
  #     PORT: 3000
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network

  # =========================
  # Admin Backend
  # =========================
  admin-backend:
    build:
      context: ../admin-backend
      dockerfile: Dockerfile
    container_name: admin-backend
    restart: always
    env_file:
      - ../admin-backend/.env
    environment:
      DB_WRITE_HOST: postgres
      REDIS_HOST: redis
      CHOKIDAR_USEPOLLING: true
      PORT: 3006
    ports:
      - "3006:3006"
    volumes:
      - ../admin-backend:/app
      - /app/node_modules
    command: npm run dev:nodemon
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # =========================
  # Admin Frontend
  # =========================
  # admin-frontend:
  #   build:
  #     context: ../admin-frontend
  #     dockerfile: Dockerfile
  #   container_name: admin-frontend
  #   restart: always
  #   ports:
  #     - "3007:3000"
  #   volumes:
  #     - ../admin-frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   environment:
  #     NODE_ENV: development
  #     NEXT_PUBLIC_API_URL: http://localhost:3006
  #     PORT: 3000
  #   depends_on:
  #     - admin-backend
  #   networks:
  #     - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge